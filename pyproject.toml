[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-alerts-desktop"
version = "0.5.0"
description = "Local sealed TCG price and restock radar"
requires-python = ">=3.11"
dependencies = ["pystray==0.19.5; sys_platform == 'win32'", "Pillow>=11,<13"]

[project.scripts]
tcg-alerts = "tcg_alerts.app:main"

[tool.setuptools.packages.find]
include = ["tcg_alerts*"]
