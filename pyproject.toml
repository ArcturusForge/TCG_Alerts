[project]
name = "tcg-alerts-desktop"
version = "0.1.0"
description = "Local sealed TCG price and restock radar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tcg-alerts = "tcg_alerts.app:main"

[tool.setuptools.packages.find]
include = ["tcg_alerts*"]
